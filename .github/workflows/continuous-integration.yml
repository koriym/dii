name: Continuous Integration
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  attribute:
    name: PHPUnit (attribute, ray.di latest)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version:
          - '8.0'
          - '8.1'
          - '8.2'
          - '8.3'
          - '8.4'
          - '8.5'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: pcov
          ini-values: zend.assertions=1

      - name: Install dependencies
        run: composer update --no-interaction --no-progress

      - name: Run test suite
        run: ./vendor/bin/phpunit

  annotation:
    name: PHPUnit (annotation, ray.di < 2.16)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version:
          - '8.0'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: pcov
          ini-values: zend.assertions=1

      - name: Pin annotation-based ray.di and doctrine/annotations 1.x
        run: composer require --no-interaction --no-update "ray/di:>=2.10 <2.16" "doctrine/annotations:^1.14"

      - name: Install dependencies
        run: composer update --no-interaction --no-progress

      - name: Run test suite
        run: ./vendor/bin/phpunit
